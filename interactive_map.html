  #map { height: 100%; width: 100%; }

  .car-icon {
    background: #e2231a;
    width: 34px;
    height: 34px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .car-icon.diesel {
    background: #1769e8;
  }
  .car-icon span {
    transform: rotate(45deg);
    font-size: 16px;
  }

  .leaflet-popup-content-wrapper {
    border-radius: 14px;
    padding: 0;
    overflow: hidden;
  }
  .leaflet-popup-content {
    margin: 0;
    width: 260px !important;
  }
  .popup-card { font-size: 14px; }
  .popup-photo {
    width: 100%;
    height: 140px;
    object-fit: cover;
    display: block;
    background: #222;
  }
  .popup-body { padding: 12px 14px 14px 14px; }
  .popup-title {
    font-size: 16px;
    font-weight: 700;
    color: #111;
    margin-bottom: 2px;
    text-decoration: none;
    display: inline-block;
  }
  a.popup-title {
    color: #c0201a;
  }
  a.popup-title:active {
    opacity: 0.7;
  }
  .popup-sub {
    font-size: 12.5px;
    color: #555;
    margin-bottom: 8px;
    line-height: 1.3;
  }
  .popup-price {
    font-size: 17px;
    font-weight: 700;
    color: #c0201a;
    margin-bottom: 10px;
  }
  .popup-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 10px;
    margin-bottom: 10px;
  }
  .popup-item { line-height: 1.25; }
  .popup-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #888;
    display: block;
  }
  .popup-value {
    font-size: 13px;
    font-weight: 600;
    color: #222;
  }
  .popup-contact {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #eee;
    padding-top: 8px;
    margin-top: 4px;
    gap: 8px;
  }
  .popup-contact-label {
    font-size: 12px;
    color: #555;
    text-decoration: none;
  }
  a.popup-contact-label {
    color: #1a6ee2;
    font-weight: 600;
  }
  a.popup-contact-label:active {
    opacity: 0.7;
  }
  .popup-contact-value {
    font-size: 13px;
    font-weight: 700;
    color: #111;
    background: #f1f1f1;
    padding: 3px 10px;
    border-radius: 20px;
    text-decoration: none;
    white-space: nowrap;
  }
  a.popup-contact-value {
    color: #0a7a3d;
    background: #e7f7ee;
  }
  a.popup-contact-value:active {
    opacity: 0.7;
  }

  const map = L.map('map', { zoomControl: true });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap prispievatelia'
  }).addTo(map);

  function createCarIcon(fuel) {
    const markerClass = fuel === 'diesel' ? 'car-icon diesel' : 'car-icon';
    return L.divIcon({
      className: '',
      html: `<div class="${markerClass}"><span>🚗</span></div>`,
      iconSize: [34, 34],
      iconAnchor: [17, 34],
      popupAnchor: [0, -32]
    });
  }

  // Rozpozná, či je "contact" reálne telefónne číslo (obsahuje aspoň 6 číslic),
  // alebo iný text (napr. "formulár") - vtedy sa nerobí klikateľný tel: odkaz.
  function isPhoneNumber(contact) {
    const digits = contact.replace(/\D/g, '');
    return digits.length >= 6;
  }

  // Vyčistí číslo na formát vhodný pre tel: odkaz (ponechá len + a číslice).
  function toTelHref(contact) {
    return 'tel:' + contact.replace(/[^\d+]/g, '');
  }

  cars.forEach(car => {
    const photoHtml = car.photo
      ? `<img class="popup-photo" src="${car.photo}" alt="${car.title}">`
      : '';

    const contactHtml = isPhoneNumber(car.contact)
      ? `<a class="popup-contact-value" href="${toTelHref(car.contact)}">${car.contact}</a>`
      : `<span class="popup-contact-value">${car.contact}</span>`;

    const popupHtml = `
      <div class="popup-card">
        ${photoHtml}
        <div class="popup-body">
          <a class="popup-title" href="${car.url}" target="_blank" rel="noopener">${car.title} ↗</a>
          <div class="popup-sub">${car.subtitle}</div>
          <div class="popup-price">${car.price}</div>
          <div class="popup-grid">
            <div class="popup-item">
              <span class="popup-label">Vek</span>
              <span class="popup-value">${car.age}</span>
            </div>
            <div class="popup-item">
              <span class="popup-label">Km</span>
              <span class="popup-value">${car.mileage}</span>
            </div>
            <div class="popup-item" style="grid-column: 1 / -1;">
              <span class="popup-label">Motorizácia</span>
              <span class="popup-value">${car.engine}</span>
            </div>
          </div>
          <div class="popup-contact">
            <a class="popup-contact-label" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(car.location)}" target="_blank" rel="noopener">${car.location} ↗</a>
            ${contactHtml}
          </div>
        </div>
      </div>
    `;

    L.marker([car.lat, car.lng], { icon: createCarIcon(car.fuel) })
      .addTo(map)
      .bindPopup(popupHtml, { maxWidth: 280, minWidth: 260 });
  });

  if (cars.length > 1) {
    const bounds = L.latLngBounds(cars.map(c => [c.lat, c.lng]));
    map.fitBounds(bounds, { padding: [40, 40] });
  } else {
    map.setView([cars[0].lat, cars[0].lng], 11);
  }
